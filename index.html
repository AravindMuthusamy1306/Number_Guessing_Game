<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Number Guessing Game</h1>
        <div class="box">
            <h2>Guess a number between 1 and 100!</h2>
            <input type="number" name="number-guess" id="number-input" placeholder="type your guess here" min="1" max="100">
            <button type="button" id="submit-button" onclick="checkGuess()">Submit Guess</button>
            <button type="button" id="reset-button" onclick="resetGame()">Reset Game</button>
            <p id="message"></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
